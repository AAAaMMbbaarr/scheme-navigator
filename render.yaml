# Render Blueprint: one FastAPI web service serving both the API and the frontend.
services:
  - type: web
    name: scheme-navigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: GROQ_API_KEY
        sync: false          # secret: you enter it in the Render dashboard; it is never stored in this repo
